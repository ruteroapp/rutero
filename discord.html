<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord conectado · Rutero</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --bg:#0A0D18; --panel:#141A2C; --text:#E9EDF5; --muted:#8C97AD; --line:#252F4A; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(120% 80% at 50% 0%, #1B2A6B 0%, var(--bg) 60%); color:var(--text); font:15px/1.5 system-ui, 'Segoe UI', sans-serif; padding:16px; }
  .card { max-width:420px; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:28px; text-align:center; }
  img { width:72px; height:72px; }
  h1 { font-size:22px; margin:14px 0 6px; }
  p { color:var(--muted); margin:0 0 6px; }
  a { color:#8FB4FF; }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.svg" alt="">
    <h1 id="t">Conectando con Rutero…</h1>
    <p id="d">Ya puedes volver a la app.</p>
  </div>
<script>
  // La app de Rutero lee el resultado y cierra esta ventana sola. Si alguien abre esta página en el navegador, solo se muestra el mensaje.
  var h = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  if (h.get('error')) { document.getElementById('t').textContent = 'Conexión cancelada'; document.getElementById('d').textContent = 'Puedes cerrar esta ventana e intentarlo de nuevo desde Rutero.'; }
  else { document.getElementById('t').textContent = '¡Discord conectado!'; }
  if (location.hash) history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
