# Borra el borrador de la versión 1.4.6 (se publicó todo junto en la 1.4.7). Se lanza una vez.
name: Limpiar borrador 1.4.6
on:
  push:
    branches: [main]
    paths: ['.github/workflows/limpiar.yml']
permissions:
  contents: write
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete v1.4.6 --yes --cleanup-tag -R ${{ github.repository }} || true
