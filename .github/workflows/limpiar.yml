# Borra las descargas de Mac y Linux de la versión 1.3.8 (se lanza una vez)
name: Limpiar descargas de Mac y Linux
on:
  push:
    branches: [main]
    paths: ['.github/workflows/limpiar.yml']
permissions:
  contents: write
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for a in $(gh api repos/${{ github.repository }}/releases/tags/v1.3.8 --jq '.assets[] | select(.name|test("mac|linux")) | .id'); do
            gh api -X DELETE repos/${{ github.repository }}/releases/assets/$a && echo "borrado $a"
          done
