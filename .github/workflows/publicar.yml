# Crea el instalador de Windows y lo publica en GitHub Releases.
# Se lanza solo cuando cambia la versión en package.json (rama main) o a mano desde la pestaña Actions.
# No hace falta ningún token personal: usa el token automático de GitHub.
name: Publicar Rutero
# (la clave del modo online se guarda en Settings > Secrets and variables > Actions > Variables)

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clave del modo online (secreto FIREBASE_API_KEY)
        shell: pwsh
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
          DISCORD_REPORTS_WEBHOOK: ${{ secrets.DISCORD_REPORTS_WEBHOOK || vars.DISCORD_REPORTS_WEBHOOK || vars.RUTERO }}
        run: |
          if (-not $env:FIREBASE_API_KEY) { Write-Error "Falta el secreto FIREBASE_API_KEY en Settings > Secrets and variables > Actions"; exit 1 }
          $cfg = @{ apiKey = $env:FIREBASE_API_KEY.Trim(); projectId = 'rutero-a0abb' }
          if ($env:DISCORD_REPORTS_WEBHOOK -and $env:DISCORD_REPORTS_WEBHOOK.Trim() -match "^https://(canary\.|ptb\.)?discord(app)?\.com/api/webhooks/") { $cfg.discordWebhook = $env:DISCORD_REPORTS_WEBHOOK.Trim(); Write-Host "Webhook de reportes: OK" } else { Write-Host "::warning::No hay webhook de Discord valido" }
          $json = $cfg | ConvertTo-Json -Compress
          Set-Content -Path config/cloud.json -Value $json -Encoding utf8NoBOM

      - name: Etiqueta de la versión (v + package.json)
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            echo "La etiqueta $V ya existe"
          else
            git tag "$V" && git push origin "$V"
          fi
          # se crea la versión (borrador) antes de compilar: así los archivos se suben todos a la misma
          if ! gh release view "$V" >/dev/null 2>&1; then
            # las novedades salen del mensaje del commit (el bot de Discord las anuncia en #actualizaciones)
            NOTES="$(git log -1 --pretty=%b | grep -vE '^(Co-Authored-By|Claude-Session):' | sed '/^[[:space:]]*$/d')"
            [ -z "$NOTES" ] && NOTES="Rutero ${V#v}. Se instala sola desde el botón de actualizar de la app."
            gh release create "$V" --draft --title "Rutero ${V#v}" --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comprobar que la app arranca (sin canales repetidos)
        shell: bash
        run: |
          for f in src/main/*.js src/renderer/*.js; do node --check "$f"; done
          DUP=$(grep -o "^  h('[^']*'" src/main/main.js | sort | uniq -d)
          if [ -n "$DUP" ]; then echo "Canales repetidos (la app no abriría): $DUP"; exit 1; fi

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear y publicar el instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Publicar la versión (quitar borrador y marcar como la última)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          gh release edit "$V" --draft=false --latest
