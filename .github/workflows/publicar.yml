# Crea el instalador de Windows y lo publica en GitHub Releases.
# Se lanza solo al subir una etiqueta de versión (v1.2.3) o a mano desde la pestaña Actions.
# No hace falta ningún token personal: usa el token automático de GitHub.
name: Publicar Rutero

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clave del modo online (secreto FIREBASE_API_KEY)
        shell: pwsh
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
        run: |
          if (-not $env:FIREBASE_API_KEY) { Write-Error "Falta el secreto FIREBASE_API_KEY en Settings > Secrets and variables > Actions"; exit 1 }
          $json = @{ apiKey = $env:FIREBASE_API_KEY; projectId = 'rutero-a0abb' } | ConvertTo-Json -Compress
          Set-Content -Path config/cloud.json -Value $json -Encoding utf8NoBOM

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear y publicar el instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
