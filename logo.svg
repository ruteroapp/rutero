<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A6B"/>
      <stop offset=".55" stop-color="#2A1C7A"/>
      <stop offset="1" stop-color="#0E1230"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".86" r=".6">
      <stop offset="0" stop-color="#FF9F1C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FF9F1C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE4FF"/>
    </linearGradient>
    <linearGradient id="amb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#FF7A1C"/>
    </linearGradient>
    <clipPath id="sq"><rect x="16" y="16" width="480" height="480" rx="120"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- pata de la R = carretera que se aleja hacia la esquina -->
    <path d="M248 262 L314 262 L548 540 L308 540 Z" fill="url(#road)"/>
    <path d="M281 300 L296 324 M312 350 L332 382 M352 414 L380 458 M402 492 L430 540" stroke="url(#amb)" stroke-width="13" stroke-linecap="round"/>
  </g>
  <!-- cuerpo de la R -->
  <path d="M164 400 V132 H286 A76 76 0 0 1 286 284 H164" fill="none" stroke="url(#road)" stroke-width="66" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- marcador de ruta en el ojo de la R -->
  <circle cx="282" cy="208" r="17" fill="url(#amb)"/>
</svg>
